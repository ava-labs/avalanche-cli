name: Code Coverage Cron Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  
jobs:
  code_cov_report:
    name: Code Coverage Report
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: "16.x"
        
      - name: Yarn Install
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: yarn --cwd ./tests/e2e/hardhat

      - name: Install Typescript
        shell: bash
        run: |
          npm install -g typescript
          npm install -g ts-node
          npm install -g tsx

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'

      - name: Install Go dependencies
        run: go mod download
      
      - name: Unit Tests
        working-directory: ${{ github.workspace }}
        run: |
          scripts/unit_test.sh

      - name: E2E Tests
        working-directory: ${{ github.workspace }}
        run: |
          scripts/run_e2e_suites_for_cov.sh

      # TODO: at the moment the coverage report is printed to the console
      #       we want to report it to PR as a comment later
      - name: Generate Code Coverage Report
        run: |
          scripts/report_coverage.sh
